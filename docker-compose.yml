version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: location_analyzer_api
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./location_analyzer.db:/app/location_analyzer.db
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=sqlite:///./location_analyzer.db
      - PYTHONUNBUFFERED=1

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: location_analyzer_ui
    ports:
      - "5173:80"
    depends_on:
      - backend
